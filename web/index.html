<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen práctico</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 30px;
        }

        header {
            background: #1d4ed8;
            color: white;
            padding: 25px;
            border-radius: 12px;
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }
    </style>
</head>
<body>
    <header>
        <h1>Examen práctico NOMVRE</h1>
        <p>Nombre: Aldo Dominguez Contrera</p>
        <p>Matrícula: 237O02069</p>
        <p>Grupo: A</p>
    </header>

    <main class="tarjetas">
        <section class="tarjeta">
            <h2>Contenedores</h2>
            <p>Aplicación web ejecutada mediante Docker.</p>
        </section>

        <section class="tarjeta">
            <h2>Git y GitHub</h2>
            <p>Control de versiones y colaboración.</p>
        </section>

        <section class="tarjeta">
            <h2>Visualización</h2>
            <p>Análisis de ventas, clientes y pedidos.</p>
        </section>
    </main>
</body>
</html>
